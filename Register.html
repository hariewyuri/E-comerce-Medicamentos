<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="AuthRegister.css">
    <script src="AuthRegister.js"></script>
</head>

<body>
    <div class="banner-auth">
        <img src="https://www.drogariasultrapopular.com.br/wp-content/themes/acfarma/assets/images/UltraPopular_banner3.jpg">
    </div>
    <div class="auth-container">
        <h2>Criar Conta</h2>
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Crie uma senha" required>
        <button type="submit" onclick="register(event)">Cadastrar</button>
    </div>
</body>

</html>
