<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="AuthRegister.css">
    <script src="AuthRegister.js"></script>
</head>

<body>

    <div class="banner-auth">
        <img src="https://www.drogariasultrapopular.com.br/wp-content/themes/acfarma/assets/images/UltraPopular_banner3.jpg">
    </div>

    <div class="auth-container">
            <h2>Entrar</h2>
            <input type="email" id="loginEmail" placeholder="E-mail" required>
            <input type="password" id="loginSenha" placeholder="Senha" required>
            <button type="submit" onclick="auth(event)">Acessar</button>
            <span>Não possui uma conta? <a href="Register.html">Cadastre-se</a></span>
    </div>
</body>

</html>
